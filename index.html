<!--
小芜白粉选择器检索器 · 全屏悬浮工具台版
特性：
1. 注入到父页面 body，不固定在小剧场空间内。
2. 默认是更短的粉白小折叠条，轻点展开。
3. 折叠短条可拖动。
4. 展开后标题栏可拖动。
5. 展开后支持拖拽四边和四角调整大小。
6. 保留原组件 cssModules 选择器数据。
7. 增加搜索、分类折叠、收藏、复制记录和导入 CSS 文件。
-->

  function initBehavior(){
    if(shell.dataset.xwBehaviorReady === '1') return;
    shell.dataset.xwBehaviorReady = '1';

    const root = shell.querySelector('#xw-css-locator-root');
    if(!root) return;

    const doc = root.ownerDocument;
    const wrapper = root.querySelector('#xw-wrapper');
    const island = root.querySelector('#xw-island');
    const compact = root.querySelector('#xw-compact');
    const dragbar = root.querySelector('#xw-dragbar');
    const closeBtn = root.querySelector('#xw-close');
    const sidebar = root.querySelector('#xw-sidebar');
    const textarea = root.querySelector('#xw-code-area');
    const search = root.querySelector('#xw-search');
    const clearBtn = root.querySelector('#xw-clear');
    const miniStat = root.querySelector('#xw-mini-stat');
    const favToggle = root.querySelector('#xw-fav-toggle');
    const historyToggle = root.querySelector('#xw-history-toggle');
    const collapseAllBtn = root.querySelector('#xw-collapse-all');
    const fileInput = root.querySelector('#xw-file-input');
    const favDrawer = root.querySelector('#xw-fav-drawer');
    const historyDrawer = root.querySelector('#xw-history-drawer');
    const favList = root.querySelector('#xw-fav-list');
    const historyList = root.querySelector('#xw-history-list');

    if(!wrapper || !island || !sidebar || !textarea) return;

    function clamp(value, min, max){
      return Math.max(min, Math.min(max, value));
    }

    function viewport(){
      return {
        w: doc.documentElement.clientWidth || window.innerWidth,
        h: doc.documentElement.clientHeight || window.innerHeight
      };
    }

    function setWrapperPosition(left, top){
      wrapper.style.setProperty('left', left + 'px', 'important');
      wrapper.style.setProperty('top', top + 'px', 'important');
    }

    function openPanel(){
      island.classList.add('xw-open');
      if(island.dataset.xwWidth) island.style.width = island.dataset.xwWidth + 'px';
      if(island.dataset.xwHeight) island.style.height = island.dataset.xwHeight + 'px';
      setTimeout(() => textarea.focus(), 40);
    }

    function closePanel(){
      island.classList.remove('xw-open');
      island.style.width = '';
      island.style.height = '';
    }

    let moving = false;
    let moved = false;
    let moveMode = '';
    let offsetX = 0;
    let offsetY = 0;
    let startX = 0;
    let startY = 0;

    function startMove(e, mode){
      if(e.button != null && e.button !== 0) return;
      if(e.target.closest('button') || e.target.closest('.xw-resize') || e.target.closest('textarea') || e.target.closest('input')) return;

      const r = wrapper.getBoundingClientRect();

      moving = true;
      moved = false;
      moveMode = mode;
      startX = e.clientX;
      startY = e.clientY;
      offsetX = e.clientX - r.left;
      offsetY = e.clientY - r.top;

      island.classList.add('xw-dragging');

      if(e.pointerId != null && e.currentTarget.setPointerCapture) {
        e.currentTarget.setPointerCapture(e.pointerId);
      }

      e.preventDefault();
    }

    function moveIsland(e){
      if(!moving) return;

      const vp = viewport();
      const rect = island.getBoundingClientRect();

      if(Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) moved = true;

      const halfW = rect.width / 2;
      const minLeft = halfW + 8;
      const maxLeft = vp.w - halfW - 8;
      const maxTop = vp.h - rect.height - 8;

      setWrapperPosition(
        clamp(e.clientX - offsetX, minLeft, Math.max(minLeft, maxLeft)),
        clamp(e.clientY - offsetY, 8, Math.max(8, maxTop))
      );

      e.preventDefault();
    }

    function endMove(){
      if(!moving) return;

      island.classList.remove('xw-dragging');

      if(moveMode === 'compact' && !moved) openPanel();

      moving = false;
      moved = false;
      moveMode = '';
    }

    if(compact) compact.addEventListener('pointerdown', e => startMove(e, 'compact'));
    if(dragbar) dragbar.addEventListener('pointerdown', e => startMove(e, 'panel'));

    doc.addEventListener('pointermove', moveIsland);
    doc.addEventListener('pointerup', endMove);
    doc.addEventListener('pointercancel', endMove);

    if(closeBtn){
      closeBtn.addEventListener('click', e => {
        e.stopPropagation();
        closePanel();
      });
    }

    let resizing = false;
    let resizeDir = '';
    let resizeStart = null;

    root.querySelectorAll('.xw-resize').forEach(handle => {
      handle.addEventListener('pointerdown', function(e){
        if(e.button != null && e.button !== 0) return;
        if(!island.classList.contains('xw-open')) return;

        resizing = true;
        resizeDir = handle.dataset.xwResize || '';
        resizeStart = island.getBoundingClientRect();

        island.classList.add('xw-dragging');

        if(e.pointerId != null && handle.setPointerCapture) {
          handle.setPointerCapture(e.pointerId);
        }

        e.stopPropagation();
        e.preventDefault();
      });
    });

    doc.addEventListener('pointermove', function(e){
      if(!resizing || !resizeStart) return;

      const vp = viewport();

      const minW = Math.min(330, vp.w - 24);
      const minH = 260;
      const maxW = vp.w - 24;
      const maxH = vp.h - 24;

      let left = resizeStart.left;
      let top = resizeStart.top;
      let width = resizeStart.width;
      let height = resizeStart.height;

      if(resizeDir.indexOf('e') >= 0) width = e.clientX - resizeStart.left;
      if(resizeDir.indexOf('w') >= 0) {
        width = resizeStart.right - e.clientX;
        left = e.clientX;
      }
      if(resizeDir.indexOf('s') >= 0) height = e.clientY - resizeStart.top;
      if(resizeDir.indexOf('n') >= 0) {
        height = resizeStart.bottom - e.clientY;
        top = e.clientY;
      }

      width = clamp(width, minW, maxW);
      height = clamp(height, minH, maxH);

      if(resizeDir.indexOf('w') >= 0) left = resizeStart.right - width;
      if(resizeDir.indexOf('n') >= 0) top = resizeStart.bottom - height;

      left = clamp(left, 12, Math.max(12, vp.w - width - 12));
      top = clamp(top, 12, Math.max(12, vp.h - height - 12));

      island.style.width = width + 'px';
      island.style.height = height + 'px';
      island.dataset.xwWidth = String(Math.round(width));
      island.dataset.xwHeight = String(Math.round(height));

      setWrapperPosition(left + width / 2, top);
      e.preventDefault();
    });

    function endResize(){
      if(!resizing) return;
      resizing = false;
      resizeDir = '';
      resizeStart = null;
      island.classList.remove('xw-dragging');
    }

    doc.addEventListener('pointerup', endResize);
    doc.addEventListener('pointercancel', endResize);

    function copyText(text){
      const parentWin = doc.defaultView || window.parent || window;
      const tries = [];

      try {
        if(parentWin.navigator && parentWin.navigator.clipboard && parentWin.navigator.clipboard.writeText){
          tries.push(() => parentWin.navigator.clipboard.writeText(text));
        }
      } catch(e) {}

      try {
        if(window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText){
          tries.push(() => window.navigator.clipboard.writeText(text));
        }
      } catch(e) {}

      function fallbackCopy(){
        return new Promise(resolve => {
          const temp = doc.createElement('textarea');
          temp.value = text;
          temp.setAttribute('readonly', 'readonly');
          temp.style.position = 'fixed';
          temp.style.left = '-9999px';
          temp.style.top = '0';
          temp.style.opacity = '0';
          temp.style.pointerEvents = 'none';
          doc.body.appendChild(temp);

          const selection = parentWin.getSelection ? parentWin.getSelection() : null;
          const oldRange = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
          const active = doc.activeElement;

          temp.focus({ preventScroll: true });
          temp.select();
          temp.setSelectionRange(0, temp.value.length);

          try { doc.execCommand('copy'); } catch(e) {}

          temp.remove();

          try {
            if(oldRange && selection){
              selection.removeAllRanges();
              selection.addRange(oldRange);
            }
          } catch(e) {}

          try {
            if(active && active.focus) active.focus({ preventScroll: true });
          } catch(e) {}

          resolve();
        });
      }

      let chain = Promise.reject();
      tries.forEach(fn => {
        chain = chain.catch(() => fn());
      });
      return chain.catch(fallbackCopy);
    }


    const memory = {
      favorites: [],
      history: []
    };

    function closeDrawers(except){
      if(favDrawer && except !== 'fav') favDrawer.classList.remove('xw-show');
      if(historyDrawer && except !== 'history') historyDrawer.classList.remove('xw-show');
    }

    function selectorKey(item){
      return item.selector;
    }

    function renderDrawer(listEl, arr, emptyText){
      if(!listEl) return;
      listEl.innerHTML = '';
      if(!arr.length){
        const empty = doc.createElement('div');
        empty.className = 'xw-empty';
        empty.textContent = emptyText;
        listEl.appendChild(empty);
        return;
      }
      arr.forEach(item => {
        const div = doc.createElement('div');
        div.className = 'xw-drawer-item';
        const title = doc.createElement('div');
        title.className = 'xw-drawer-item-title';
        title.textContent = item.name || 'selector';
        const code = doc.createElement('div');
        code.className = 'xw-drawer-item-code';
        code.textContent = item.selector || '';
        div.appendChild(title);
        div.appendChild(code);
        div.addEventListener('click', () => {
          copyText(item.selector || '').then(() => addHistory(item));
        });
        listEl.appendChild(div);
      });
    }

    function renderCollections(){
      renderDrawer(favList, memory.favorites, '还没有收藏，点标签旁边的小星星。');
      renderDrawer(historyList, memory.history, '还没有复制记录。');
      root.querySelectorAll('.tag-item').forEach(tag => {
        const star = tag.querySelector('.tag-star');
        if(star){
          const on = memory.favorites.some(x => x.selector === tag.dataset.selector);
          star.classList.toggle('xw-starred', on);
          star.textContent = on ? '★' : '☆';
        }
      });
    }

    function addHistory(item){
      memory.history = memory.history.filter(x => x.selector !== item.selector);
      memory.history.unshift({ name: item.name, selector: item.selector });
      memory.history = memory.history.slice(0, 12);
      renderCollections();
    }

    function toggleFavorite(item){
      const exists = memory.favorites.some(x => x.selector === item.selector);
      if(exists){
        memory.favorites = memory.favorites.filter(x => x.selector !== item.selector);
      } else {
        memory.favorites.unshift({ name: item.name, selector: item.selector });
      }
      renderCollections();
    }

    function setSectionCollapsed(header, collapsed){
      header.classList.toggle('xw-collapsed', collapsed);
      let el = header.nextElementSibling;
      while(el && !el.classList.contains('module-header')){
        if(el.classList && el.classList.contains('tag-item')) el.classList.toggle('xw-section-collapsed', collapsed);
        el = el.nextElementSibling;
      }
    }

    function initSidebar(){
      sidebar.innerHTML = '';

      for(const [moduleName, items] of Object.entries(cssModules)){
        const header = doc.createElement('div');
        header.className = 'module-header';
        header.textContent = moduleName;
        header.addEventListener('click', () => setSectionCollapsed(header, !header.classList.contains('xw-collapsed')));
        sidebar.appendChild(header);

        items.forEach(item => {
          const tagDiv = doc.createElement('div');
          tagDiv.className = 'tag-item missing';
          tagDiv.dataset.selector = item.selector;
          tagDiv.dataset.name = item.name;
          tagDiv.dataset.module = moduleName;

          const name = doc.createElement('span');
          name.className = 'tag-name';
          name.title = item.selector;
          name.textContent = item.name;

          const star = doc.createElement('span');
          star.className = 'tag-star';
          star.textContent = '☆';
          star.title = '收藏 selector';

          const status = doc.createElement('span');
          status.className = 'tag-status';

          tagDiv.appendChild(name);
          tagDiv.appendChild(star);
          tagDiv.appendChild(status);

          star.addEventListener('click', e => {
            e.stopPropagation();
            toggleFavorite(item);
          });

          tagDiv.addEventListener('click', () => {
            if(tagDiv.classList.contains('missing')) {
              copyText(item.selector).then(() => {
                const old = item.name;
                name.classList.add('copied');
                name.textContent = '已复制';
                setTimeout(() => {
                  name.classList.remove('copied');
                  name.textContent = old;
                }, 1100);
                addHistory(item);
              });
            } else {
              locateCode(item.selector);
            }
          });

          sidebar.appendChild(tagDiv);
        });
      }
    }

    function locateCode(selector){
      const code = textarea.value;
      const index = code.indexOf(selector);

      if(index !== -1){
        textarea.focus();
        textarea.setSelectionRange(index, index + selector.length);

        const lines = code.substring(0, index).split('\n').length;
        textarea.scrollTop = Math.max(0, (lines - 5) * 19.4);
      }
    }

    function validateCode(){
      const code = textarea.value;
      const items = root.querySelectorAll('.tag-item');
      let found = 0;
      let total = 0;

      items.forEach(item => {
        const selector = item.dataset.selector;
        total++;

        if(code.includes(selector)){
          found++;
          item.classList.remove('missing');
          item.classList.add('found');
        } else {
          item.classList.remove('found');
          item.classList.add('missing');
        }
      });

      if(miniStat){
        miniStat.textContent = code.trim() ? ('已找到 ' + found + ' / ' + total) : '等待粘贴代码';
      }
    }

    function filterTags(){
      const q = (search && search.value || '').trim().toLowerCase();
      const tags = root.querySelectorAll('.tag-item');

      tags.forEach(tag => {
        const hay = ((tag.dataset.name || '') + ' ' + (tag.dataset.module || '') + ' ' + (tag.dataset.selector || '')).toLowerCase();
        tag.classList.toggle('xw-hidden', !!q && hay.indexOf(q) < 0);
      });

      root.querySelectorAll('.module-header').forEach(header => {
        let el = header.nextElementSibling;
        let hasVisible = false;

        while(el && !el.classList.contains('module-header')){
          if(el.classList && el.classList.contains('tag-item') && !el.classList.contains('xw-hidden')) {
            hasVisible = true;
            break;
          }
          el = el.nextElementSibling;
        }

        header.style.display = hasVisible || !q ? '' : 'none';
      });
    }

    textarea.addEventListener('input', validateCode);
    textarea.addEventListener('paste', () => setTimeout(validateCode, 80));

    if(search) search.addEventListener('input', filterTags);

    if(clearBtn){
      clearBtn.addEventListener('click', () => {
        textarea.value = '';
        validateCode();
        textarea.focus();
      });
    }


    if(favToggle){
      favToggle.addEventListener('click', () => {
        closeDrawers('fav');
        favDrawer && favDrawer.classList.toggle('xw-show');
        renderCollections();
      });
    }

    if(historyToggle){
      historyToggle.addEventListener('click', () => {
        closeDrawers('history');
        historyDrawer && historyDrawer.classList.toggle('xw-show');
        renderCollections();
      });
    }

    root.querySelectorAll('[data-xw-close-drawer]').forEach(btn => {
      btn.addEventListener('click', () => closeDrawers());
    });

    if(collapseAllBtn){
      collapseAllBtn.addEventListener('click', () => {
        const headers = Array.from(root.querySelectorAll('.module-header'));
        const shouldCollapse = headers.some(h => !h.classList.contains('xw-collapsed'));
        headers.forEach(h => setSectionCollapsed(h, shouldCollapse));
        collapseAllBtn.textContent = shouldCollapse ? '展开分类' : '折叠分类';
      });
    }

    if(fileInput){
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          textarea.value = String(reader.result || '');
          validateCode();
          textarea.focus();
        };
        reader.readAsText(file);
        fileInput.value = '';
      });
    }

    initSidebar();
    renderCollections();
    validateCode();
  }

  initBehavior();
})();
</script>
